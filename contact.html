<!DOCTYPE html>
<html lang="ka">

<head>

    <title>Contact | Mia Art Gallery</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background-color: #F5F5DC;

            display: flex;
            flex-direction: column;
        }

        /* ===== LANGUAGE TOGGLE ===== */

        .lang-toggle {
            display: flex;
            gap: 4px;

            background: rgba(245,245,220,0.9);

            border: 1.5px solid #c7950a60;
            border-radius: 30px;

            padding: 4px 6px;

            backdrop-filter: blur(10px);

            position: fixed;
            top: 15px;
            right: 24px;

            z-index: 200;
        }

        .lang-btn {
            background: none;
            border: none;

            cursor: pointer;

            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            font-weight: bold;

            color: #c7950ab0;

            padding: 5px 12px;

            border-radius: 20px;

            transition: 0.25s;

            letter-spacing: 0.05em;
        }

        .lang-btn.active {
            background-color: #D2691E;
            color: #fff;
        }

        .lang-btn:hover:not(.active) {
            color: #D2691E;
        }

        /* ===== NAVIGATION ===== */

        nav {
            position: fixed;
            top: 0;
            width: 100%;

            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;

            padding: 15px 20px;

            background: rgba(245, 245, 220, 0.85);

            backdrop-filter: blur(10px);

            box-sizing: border-box;
        }

        .nav-links {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #c7950ab0;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            transition: 0.3s;
        }

        nav a:hover {
            color: #D2691E;
        }

        /* ===== MAIN ===== */

        main {
            flex: 1;
        }

        /* ===== FORM ===== */

        form {
            background-color: white;

            width: 400px;
            max-width: 90%;

            margin: 170px auto 40px;

            padding: 32px;

            border-radius: 16px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.08);

            box-sizing: border-box;
        }

        h2 {
            color: #5a3e2b;

            font-family: 'Dancing Script', cursive;

            font-size: 32px;

            margin-bottom: 24px;

            text-align: center;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            color: #5a3e2b;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            margin-bottom: 16px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-family: 'Raleway', sans-serif;

            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            background-color: #5a3e2b;

            color: #f0c040;

            padding: 12px 24px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-family: 'Raleway', sans-serif;

            font-size: 15px;

            transition: 0.3s;
        }

        button:hover {
            background-color: #D2691E;
            transform: scale(1.05);
            color: white;
        }

        /* ===== FOOTER ===== */

        footer {
            padding: 30px 20px;

            color: #D2691E;

            text-align: center;

            font-size: 11px;
        }

        footer p {
            margin: 0;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding: 15px 20px;
            }

            nav .lang-toggle {
                position: static;
                margin-top: 4px;
            }

            nav a {
                font-size: 14px;
            }

            form {
                margin-top: 180px;
                padding: 24px;
            }

            h2 {
                font-size: 26px;
            }
        }

    </style>

</head>

<body>

    <!-- NAVIGATION -->

    <nav>

        <div class="nav-links">

            <a href="Miamain.html"
               data-ka="მთავარი"
               data-en="Home">

               მთავარი

            </a>

            <a href="about.html"
               data-ka="ჩემს შესახებ"
               data-en="About">

               ჩემს შესახებ

            </a>

            <a href="contact.html"
               data-ka="კონტაქტი"
               data-en="Contact">

               კონტაქტი

            </a>

        </div>

        <div class="lang-toggle">

            <button class="lang-btn active"
                    onclick="setLang('ka')">

                    GE

            </button>

            <button class="lang-btn"
                    onclick="setLang('en')">

                    EN

            </button>

        </div>

    </nav>

    <!-- MAIN -->

    <main>

        <form action="https://formspree.io/f/mojrzppg"
              method="POST">

            <h2 data-ka="გამოგვიგზავნე შეკითხვები"
                data-en="Send Us a Message">

                გამოგვიგზავნე შეკითხვები

            </h2>

            <label data-ka="სახელი და გვარი"
                   data-en="Full Name">

                   სახელი და გვარი

            </label>

            <input type="text"
                   name="name">

            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="example@gmail.com">

            <label data-ka="თემა"
                   data-en="Subject">

                   თემა

            </label>

            <select name="subject">

                <option data-ka="შეკითხვა"
                        data-en="Inquiry">

                        შეკითხვა

                </option>

                <option data-ka="სხვა"
                        data-en="Other">

                        სხვა

                </option>

            </select>

            <label data-ka="მესიჯი"
                   data-en="Message">

                   მესიჯი

            </label>

            <textarea rows="4"
                      name="message"
                      placeholder="Type message..."></textarea>

            <button type="submit"
                    data-ka="გაგზავნა"
                    data-en="Send">

                    გაგზავნა

            </button>

        </form>

    </main>

    <!-- FOOTER -->

    <footer>
        <p>© 2026 Mia Art Gallery | Teo Uchaneishvili | All Rights Reserved</p>
    </footer>

    <script>

        let currentLang = 'ka';

        function updateLinks(lang) {

            document.querySelectorAll('nav a').forEach(a => {

                const url = new URL(a.href, location.href);

                url.searchParams.set('lang', lang);

                a.href = url.toString();

            });
        }

        const urlLang = new URLSearchParams(window.location.search).get('lang');

        if (urlLang === 'en') {

            currentLang = 'en';

            document.querySelectorAll('.lang-btn').forEach(btn => {

                btn.classList.toggle(
                    'active',
                    btn.getAttribute('onclick').includes("'en'")
                );

            });

            document.querySelectorAll('[data-en]').forEach(el => {

                if (el.tagName === 'OPTION') return;

                const content = el.getAttribute('data-en');

                if (content) {
                    el.textContent = content;
                }

            });

            document.querySelectorAll('option[data-en]').forEach(opt => {

                opt.textContent = opt.getAttribute('data-en');

            });

            updateLinks('en');
        }

        function setLang(lang) {

            if (lang === currentLang) return;

            currentLang = lang;

            document.documentElement.lang = lang;

            document.querySelectorAll('.lang-btn').forEach(btn => {

                btn.classList.toggle(
                    'active',
                    btn.getAttribute('onclick').includes("'" + lang + "'")
                );

            });

            document.querySelectorAll('[data-ka]').forEach(el => {

                if (el.tagName === 'OPTION') return;

                const content = el.getAttribute('data-' + lang);

                if (content) {
                    el.textContent = content;
                }

            });

            document.querySelectorAll('option[data-ka]').forEach(opt => {

                opt.textContent = opt.getAttribute('data-' + lang);

            });

            updateLinks(lang);
        }

    </script>

</body>
</html>
