<!DOCTYPE html>
<html lang="ka">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mia Art Gallery</title> 

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
    margin: 0;
    background-color: #F5F5DC;
    font-family: 'Raleway', sans-serif;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 15px 20px;
    background: rgba(245, 245, 220, 0.85);
    backdrop-filter: blur(10px);
}

nav a {
    text-decoration: none;
    color: #c7950ab0;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: #D2691E;
}

/* BANNER */
.banner {
    width: 100%;
    height: 60vh;
    margin-top: 70px;
}

.banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* HERO */
.hero {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
}

.hero h1 {
    font-size: 64px;
    margin: 0 0 20px;
    color: #D2691E;
    font-family: 'Dancing Script', cursive;
}

.hero p {
    font-size: 18px;
    max-width: 650px;
    line-height: 1.7;
    color: #5a3e2b;
    margin-bottom: 30px;
}

/* BUTTON */
.btn {
    background-color: #f0c040;
    color: #1a1a1a;
    padding: 14px 34px;
    border-radius: 30px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background-color: #D2691E;
    transform: scale(1.05);
    color: white;
}

/* CONTACT TEXT */
.contact-hint {
    margin-top: 20px;
    font-size: 14px;
}

.contact-hint a {
    color: #D2691E;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 60px 20px;
    color: #D2691E;
}

/* RESPONSIVE */
@media (max-width: 768px) {

    nav {
        flex-wrap: wrap;
        gap: 15px;
    }

    nav a {
        font-size: 14px;
    }

    .banner {
        height: 35vh;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero p {
        font-size: 15px;
    }
}

</style>
</head>

<body>

<nav>
    <a href="Miamain.html">მთავარი</a>
    <a href="about me.html">ჩემს შესახებ</a>
    <a href="contact.html">კონტაქტი</a>
</nav>

<div class="banner">
    <img src="mia.jpg" class="banner-img">
</div>

<div class="hero">
    <h1>Mia Art Gallery</h1>
    <p>კეთილი იყოს თქვენი მობრძანება ჩემს გალერეაში 💛</p>

    <a href="miawork.html" class="btn">იხილეთ ნამუშევრები →</a>

    <p class="contact-hint">
        ნახატის შეძენის სურვილის შემთხვევაში — <a href="contactt.html">მოგვწერეთ</a>
    </p>
</div>

<footer>
    <p>© 2026 Mia Art Gallery | Teo Uchaneishvili | All Rights Reserved</p>
</footer>

<script>
const text = "Mia Art Gallery";
const h1 = document.querySelector('.hero h1');
h1.textContent = '';

let i = 0;
function type() {
    if (i < text.length) {
        h1.textContent += text[i];
        i++;
        setTimeout(type, 100);
    }
}
type();
</script>

</body>
</html>
