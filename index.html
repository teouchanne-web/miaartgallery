<!DOCTYPE html>
<html>
<head> 
    <title>Mia Art Gallery</title> 
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <meta charset="UTF-8">

    <style>
        body {
            background-color: #F5F5DC;
            margin: 0;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background-color: transparent;
            box-sizing: border-box;
            backdrop-filter: blur(1px);
            z-index: 100;
        }

        nav a {
            color: #c7950ab0;
            text-decoration: none;
            margin: 0 16px;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Raleway', sans-serif;
        }

        nav a:hover {
            color: #D2691E;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 28px;
            color: #c7950ab0;
        }

        .nav-links {
            display: flex;
        }

        .banner {
            margin-top: 70px;
            width: 100%;
            height: 50vh;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0px 40px 100px;
   
    margin-top: -250px;
        }

        .hero h1 {
            font-size: 70px;
            margin-bottom: 20px;
            color: #D2691E;
            font-family: 'Dancing Script', cursive;
            animation: slideUp 1s ease both;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #5a3e2b;
            animation: slideUp 1s 0.3s ease both;
        }

        .btn {
            background-color: #f0c040;
            color: #1a1a1a;
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            animation: slideUp 1s 0.6s ease both;
        }

        .btn:hover {
            background-color: #D2691E;
            transform: scale(1.05);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #5a3e2b;
            animation: slideUp 1s 0.9s ease both;
        }

        .contact-hint a {
            color: #D2691E;
            text-decoration: underline;
        }

      footer p {
    margin: 0 auto;
    text-align: center;
} 
footer {
    padding: 100px 20px 60px; 
    color: #D2691E;
} 
@media (max-width: 768px) {
    nav a {
        font-size: 14px;
        margin: 0 8px;
    }

    .hero h1 {
        font-size: 40px;
    }

    .hero p {
        font-size: 15px;
    }

    .banner {
        height: 30vh;
    }
}
    </style> 
</head>

<body>

    <nav>
        <div class="nav-links">
            <a href="index.html">მთავარი</a>
            <a href="about.html">ჩემს შესახებ</a>
           
            <a href="contact.html">კონტაქტი</a>
        </div>
        
    </nav>

    <div class="banner">
        <img src="mia.jpg" class="banner-img">
    </div>

    <div class="hero">
        <h1>Mia Art Gallery</h1>
        <p>კეთილი იყოს თქვენი მობრძანება ჩემს გალერეაში 💛 </p>
        <a href="miawork.html" class="btn">იხილეთ ნახატები →</a>
        <p class="contact-hint">ნახატის შეძენის სურვილის შემთხვევაში — <a href="contactt.html">მოგვწერეთ</a></p>
    </div>

    <footer>
        <p>©  2026 Mia Art Gallery | Teo Uchaneishvili | All Rights Reserved </p> 
        
    </footer>

    <script>
        const text = "Mia Art Gallery";
        const h1 = document.querySelector('.hero h1');
        h1.textContent = '';
        
        let i = 0;
        function type() {
            if (i < text.length) {
                h1.textContent += text[i];
                i++;
                setTimeout(type, 100);
            }
        }
        
        type();
    </script>

</body>
</html>
