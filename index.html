<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background-color: #F5F5DC;
    font-family: 'Raleway', sans-serif;
}

/* ===== LANGUAGE TOGGLE ===== */

.lang-toggle {
    display: flex;
    gap: 4px;
    background: rgba(245,245,220,0.9);
    border: 1.5px solid #c7950a60;
    border-radius: 30px;
    padding: 4px 6px;
    backdrop-filter: blur(10px);
    position: fixed;
    top: 15px;
    right: 24px;
    z-index: 200;
}

.lang-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #c7950ab0;
    padding: 5px 12px;
    border-radius: 20px;
    transition: 0.25s;
    letter-spacing: 0.05em;
}

.lang-btn.active {
    background-color: #D2691E;
    color: #fff;
}

.lang-btn:hover:not(.active) {
    color: #D2691E;
}

/* ===== NAVIGATION ===== */

nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 15px 20px;
    background: rgba(245, 245, 220, 0.85);
    backdrop-filter: blur(10px);
    box-sizing: border-box;
}

.nav-links {
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
}

nav a {
    text-decoration: none;
    color: #c7950ab0;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: #D2691E;
}

/* ===== BANNER ===== */

.banner {
    width: 100%;
    height: 60vh;
    margin-top: 70px;
}

.banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===== HERO ===== */

.hero {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
}

.hero h1 {
    font-size: 64px;
    margin: 0 0 20px;
    color: #D2691E;
    font-family: 'Dancing Script', cursive;
    min-height: 80px;
}

.hero p {
    font-size: 18px;
    max-width: 650px;
    line-height: 1.7;
    color: #5a3e2b;
    margin-bottom: 30px;
}

.btn {
    background-color: #f0c040;
    color: #1a1a1a;
    padding: 14px 34px;
    border-radius: 30px;
    font-weight: bold;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background-color: #D2691E;
    transform: scale(1.05);
    color: white;
}

.contact-hint {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
}

.contact-hint a {
    color: #D2691E;
}

/* ===== FOOTER ===== */

footer {
    text-align: center;
    padding: 60px 20px;
    color: #D2691E;
    font-size: 11px;
}

footer p {
    margin: 0;
    font-size: 11px;
}

.hero p,
.hero .btn,
.hero .contact-hint {
    transition: opacity 0.3s ease;
}

.fading {
    opacity: 0;
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {

    nav {
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 15px 20px;
    }

    nav .lang-toggle {
        position: static;
        margin-top: 4px;
    }

    .banner {
        height: 35vh;
        margin-top: 130px;
    }

    .hero {
        padding: 40px 16px;
    }

    .hero h1 {
        font-size: 38px;
        min-height: 52px;
    }

    .hero p {
        font-size: 15px;
    }

    .btn {
        padding: 12px 24px;
        font-size: 14px;
    }

    footer {
        padding: 30px 20px;
        font-size: 11px;
    }

    nav a {
        font-size: 15px;
    }


}

</style>
</head>

<body>

<nav>
    <div class="nav-links">
        <a href="index.html" data-ka="მთავარი" data-en="Home">მთავარი</a>
        <a href="about.html" data-ka="ჩემს შესახებ" data-en="About">ჩემს შესახებ</a>
        <a href="contact.html" data-ka="კონტაქტი" data-en="Contact">კონტაქტი</a>
    </div>

    <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('ka')">GE</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
</nav>

<div class="banner">
    <img src="cover.jpg" class="banner-img" alt="Mia Art Gallery">
</div>

<div class="hero">

    <h1 id="typed-title"></h1>

    <p data-ka="კეთილი იყოს თქვენი მობრძანება ჩემს გალერეაში 💛"
       data-en="Welcome to my art gallery 💛">
        კეთილი იყოს თქვენი მობრძანება ჩემს გალერეაში 💛
    </p>

    <a href="miawork.html"
       class="btn"
       data-ka="იხილეთ ნამუშევრები →"
       data-en="View Artworks →">
        იხილეთ ნამუშევრები →
    </a>

    <p class="contact-hint"
       data-ka='ნახატის შეძენის სურვილის შემთხვევაში — <a href="contactt.html">მოგვწერეთ</a>'
       data-en='Interested in purchasing a painting? — <a href="contactt.html"><span style="white-space:nowrap">Contact us</span></a>'>ნახატის შეძენის სურვილის შემთხვევაში — <a href="contactt.html"><span style="white-space:nowrap">მოგვწერეთ</span></a></p>

</div>

<footer>
    <p>© 2026 Mia Art Gallery | Teo Uchaneishvili | All Rights Reserved</p>
</footer>

<script>

const titleText = "Mia Art Gallery";
const h1 = document.getElementById('typed-title');

function typeWriter(text, el, speed) {
    el.textContent = '';
    let i = 0;
    function type() {
        if (i < text.length) {
            el.textContent += text[i++];
            setTimeout(type, speed);
        }
    }
    type();
}

typeWriter(titleText, h1, 100);

let currentLang = 'ka';

function updateLinks(lang) {
    document.querySelectorAll('nav a, a.btn, a.order-btn').forEach(a => {
        const url = new URL(a.href, location.href);
        url.searchParams.set('lang', lang);
        a.href = url.toString();
    });
    document.querySelectorAll('.contact-hint a').forEach(a => {
        const url = new URL(a.href, location.href);
        url.searchParams.set('lang', lang);
        a.href = url.toString();
    });
}

const urlLang = new URLSearchParams(window.location.search).get('lang');

if (urlLang === 'en') {
    currentLang = 'en';
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes("'en'"));
    });
    document.querySelectorAll('[data-en]').forEach(el => {
        if (el.classList.contains('contact-hint')) {
            el.innerHTML = el.getAttribute('data-en');
        } else {
            el.textContent = el.getAttribute('data-en');
        }
    });
    updateLinks('en');
}

function setLang(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    document.documentElement.lang = lang;

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active',
            btn.getAttribute('onclick').includes("'" + lang + "'"));
    });

    document.querySelectorAll('[data-ka]').forEach(el => {
        const content = el.getAttribute('data-' + lang);
        if (content) {
            if (el.classList.contains('contact-hint')) {
                el.innerHTML = content;
            } else {
                el.textContent = content;
            }
        }
    });

    updateLinks(lang);
    typeWriter(titleText, h1, 80);
}

</script>

</body>
</html>
