<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order | Mia Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: 'Raleway', sans-serif;
    background-color: #F5F5DC;
    display: flex;
    flex-direction: column;
}

/* ===== NAV ===== */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;

    padding: 14px 20px;
    background: rgba(245,245,220,0.9);
    backdrop-filter: blur(10px);
}

.nav-links {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    white-space: nowrap;
}

.nav-links a {
    color: #c7950ab0;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

.nav-links a:hover {
    color: #D2691E;
}

/* ===== TOGGLE ===== */
.lang-toggle {
    display: flex;
    gap: 4px;

    background: rgba(245,245,220,0.95);
    border: 1.5px solid #c7950a60;
    border-radius: 30px;
    padding: 4px 6px;

    position: fixed;
    top: 15px;
    right: 24px;
    z-index: 300;
}

.lang-btn {
    background: none;
    border: none;
    cursor: pointer;

    font-size: 13px;
    font-weight: bold;
    color: #c7950ab0;

    padding: 5px 12px;
    border-radius: 20px;
    transition: 0.25s;
}

.lang-btn.active {
    background-color: #D2691E;
    color: #fff;
}

.lang-btn:hover:not(.active) {
    color: #D2691E;
}

/* ===== FORM ===== */
main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 16px 40px;
    box-sizing: border-box;
}

form {
    background-color: white;
    padding: 32px;
    border-radius: 12px;

    width: 100%;
    max-width: 440px;           /* მობილზე სრული სიგანე, დესქტოპზე max 440px */
    box-sizing: border-box;

    margin-top: 120px;

    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    align-self: flex-start;
}

h2 {
    color: #5a3e2b;
    font-family: 'Dancing Script', cursive;
    font-size: 26px;
    margin-bottom: 20px;
    margin-top: 0;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #5a3e2b;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;     /* ← ეს იყო მთავარი პრობლემა */
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #c7950a;
}

button {
    background-color: #5a3e2b;
    color: #f0c040;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    width: 100%;
    transition: 0.3s;
}

button:hover {
    background-color: #D2691E;
    color: white;
}

/* ===== FOOTER ===== */
footer {
    padding: 30px 20px;
    text-align: center;
    color: #D2691E;
    font-size: 12px;
}

footer br {
    display: none;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

    nav {
        flex-direction: column;
        gap: 10px;
    }

    .lang-toggle {
        position: static;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links a {
        font-size: 15px;
    }

    form {
        margin-top: 160px;
        padding: 24px 18px;
    }

    footer br {
        display: inline;
    }
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div class="nav-links">
        <a href="index.html"
           data-ka="მთავარი"
           data-en="Home">მთავარი</a>
        <a href="about.html"
           data-ka="ჩემს შესახებ"
           data-en="About">ჩემს შესახებ</a>
        <a href="contact.html"
           data-ka="კონტაქტი"
           data-en="Contact">კონტაქტი</a>
    </div>

    <div class="lang-toggle">
        <button class="lang-btn" onclick="setLang('ka')">GE</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
</nav>

<!-- FORM -->
<main>
<form action="https://formspree.io/f/mojrzppg" method="POST">

    <h2 data-ka="შეკვეთის ფორმა" data-en="Order Form">შეკვეთის ფორმა</h2>

    <label data-ka="სახელი და გვარი" data-en="Full Name">სახელი და გვარი</label>
    <input type="text" name="name">

    <label data-ka="ელ.ფოსტა" data-en="Email">ელ.ფოსტა</label>
    <input type="email" name="email">

    <label data-ka="ტელეფონი" data-en="Phone Number">ტელეფონი</label>
    <input type="text" name="phone">

    <label data-ka="კოდი" data-en="Painting Code">კოდი</label>
    <input type="text" name="code" id="code-input">

    <label data-ka="მესიჯი" data-en="Message">მესიჯი</label>
    <textarea name="message"></textarea>

    <button type="submit" data-ka="გაგზავნა" data-en="Send">გაგზავნა</button>

</form>
</main>

<!-- FOOTER -->
<footer>
    © 2026 Mia Art Gallery<br>Teo Uchaneishvili | All Rights Reserved
</footer>

<script>

// URL-დან კოდის ავტომატური შევსება
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');
if(code){
    document.getElementById('code-input').value = code;
}

// ენის სისტემა
const urlLang = urlParams.get('lang');
let currentLang = urlLang || localStorage.getItem('lang') || 'ka';

function setLang(lang){
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;

    const url = new URL(window.location.href);
    url.searchParams.set('lang', lang);
    window.history.replaceState({}, '', url);

    document.querySelectorAll('.lang-btn').forEach(btn=>{
        btn.classList.toggle('active',
            btn.getAttribute('onclick').includes("'" + lang + "'")
        );
    });

    document.querySelectorAll('[data-ka]').forEach(el=>{
        const text = el.getAttribute('data-' + lang);
        if(text) el.textContent = text;
    });
}

setLang(currentLang);

</script>

</body>
</html>
