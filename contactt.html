<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title> 
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif; 
            background-color: #F5F5DC; 
             
        }
 nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 16px;
            background-color: transparent;
            box-sizing: border-box;
            backdrop-filter: blur(1px);
            z-index: 100;
        }

        nav a {
            color: #c7950ab0;
            text-decoration: none;
            margin: 0 16px;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Raleway', sans-serif;
        }

        nav a:hover {
            color: #D2691E;
        }
        form {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            width: 400px;
            margin: 180px auto;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background-color: #5a3e2b;
            color: #c7950ab0;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer; 
                transition: 0.3s; /* ← დაამატე */

        }   

         button:hover {
    background-color: #F5F5DC;
    transform: scale(1.08);
}
h2 {
    color:#5a3e2b;
} 

label{
    color:#5a3e2b;
} 
button{
    font-weight:bold;
} 

    footer p {
    margin: 0 auto;
    text-align: center;
} 
footer {
    padding: 100px 20px 60px; 
    color: #D2691E;
}

    </style>
</head>

<input type="text" name="name" placeholder="">
